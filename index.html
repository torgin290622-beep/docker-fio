<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Docker! — Ибадулла Ақторғын</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 600px;
      padding: 48px 24px;
      text-align: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
    }

    h1 {
      margin: 0 0 24px;
      color: #38bdf8;
      font-size: clamp(32px, 7vw, 48px);
    }

    h2 {
      margin: 0 0 24px;
      font-size: clamp(24px, 5vw, 32px);
    }

    p {
      margin: 0;
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello Docker!</h1>
    <h2>Ибадулла Ақторғын</h2>
    <p>Киберриск · СӨЖ</p>
    <p>Docker контейнеризациясы</p>
  </main>
</body>
</html>
